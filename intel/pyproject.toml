[project]
name = "agentguard-intel"
version = "0.1.0"
description = "AgentGuard intelligence service: injection scanner, intent judge, risk scorer"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "anthropic>=0.98",
    "httpx>=0.27",
    "cryptography>=42",
]

[project.optional-dependencies]
dev = ["pytest>=8", "jsonschema>=4"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["intel"]

[tool.pytest.ini_options]
testpaths = ["tests"]
