# Render free web instances can sleep when idle. Keep private-network services and Postgres in one region.
services:
  - type: web
    name: agentguard-gateway
    runtime: go
    branch: ritika
    autoDeploy: true
    rootDir: gateway
    region: oregon
    plan: free
    buildCommand: mkdir -p bin && go build -o bin/gateway .
    startCommand: ./bin/gateway
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: agentguard-db
          property: connectionString
      - key: INTELLIGENCE_HOSTPORT
        fromService:
          type: web
          name: agentguard-intelligence
          property: hostport
      - key: CORS_ALLOWED_ORIGINS
        sync: false # Set the exact public dashboard origin at Blueprint setup.
      - key: PAYPAL_BASE_URL
        value: https://api-m.sandbox.paypal.com
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_WEBHOOK_ID
        sync: false
      - key: MANDATE_PUBLIC_KEY
        sync: false
      - key: MANDATE_PRIVATE_KEY
        sync: false

  - type: web
    name: agentguard-intelligence
    runtime: python
    branch: ritika
    autoDeploy: true
    rootDir: intelligence
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: LLM_API_KEY
        sync: false

  - type: web
    name: agentguard-dashboard
    # Static sites use Render CDN and have no plan, region, or HTTP health check setting.
    runtime: static
    branch: ritika
    autoDeploy: true
    rootDir: dashboard
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_USE_STUB
        value: "false"
      - key: VITE_DEMO_MODE
        value: "true"
      - key: VITE_PAYPAL_CLIENT_ID
        fromService:
          type: web
          name: agentguard-gateway
          envVarKey: PAYPAL_CLIENT_ID
      - key: VITE_GATEWAY_URL
        fromService:
          type: web
          name: agentguard-gateway
          envVarKey: RENDER_EXTERNAL_URL

# Postgres uses platform health monitoring. Run demo seeding manually from the deployment checklist.
databases:
  - name: agentguard-db
    region: oregon
    plan: free
    ipAllowList: []
